<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 280"
  role="img"
  aria-labelledby="pop-title pop-desc"
  width="100%"
  style="max-width:760px;height:auto;font-family:Arial,sans-serif"
>
  <title id="pop-title">Population change</title>
  <desc id="pop-desc">
    A simple diagram showing that births add to population, deaths reduce population,
    and migration can either add to or reduce population.
  </desc>

  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3878c5"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#68a41e"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#732777"/>
    </marker>
  </defs>

  <!-- Central box -->
  <rect x="290" y="95" width="180" height="90" rx="14" fill="#00205b"/>
  <text x="380" y="148" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">
    Population
  </text>

  <!-- Births box -->
  <rect x="40" y="35" width="160" height="58" rx="12" fill="#3878c5"/>
  <text x="120" y="70" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">
    + Births
  </text>
  <line
    x1="200" y1="64" x2="290" y2="118"
    stroke="#3878c5" stroke-width="4"
    marker-end="url(#arrow-blue)"
  />

  <!-- Deaths box (fixed contrast) -->
  <rect x="40" y="187" width="160" height="58" rx="12" fill="#68a41e"/>
  <text x="120" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#000000">
    − Deaths
  </text>
  <line
    x1="290" y1="162" x2="200" y2="216"
    stroke="#68a41e" stroke-width="4"
    marker-end="url(#arrow-green)"
  />

  <!-- Migration box -->
  <rect x="560" y="95" width="160" height="90" rx="12" fill="#732777"/>
  <text x="640" y="128" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">
    ± Migration
  </text>
  <text x="640" y="151" text-anchor="middle" font-size="13" fill="#ffffff">
    in or out
  </text>

  <!-- Migration arrows -->
  <line
    x1="560" y1="125" x2="470" y2="125"
    stroke="#732777" stroke-width="4"
    marker-end="url(#arrow-purple)"
  />
  <line
    x1="470" y1="155" x2="560" y2="155"
    stroke="#732777" stroke-width="4"
    marker-end="url(#arrow-purple)"
  />
</svg>